[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graphkoda-neo4j-mcp"
version = "0.1.0"
description = "Read-only bounded Neo4j exploration for code and runtime graphs over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.30,<2",
  "neo4j>=6.2,<7",
]

[project.scripts]
graphkoda-neo4j-mcp = "graphkoda_neo4j_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphkoda_neo4j_mcp"]
